name: Feature request
description: Propose a focused product or adapter improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need without including private recordings or transcripts.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Suggested boundary
      description: If relevant, identify the source, transport, model, integration, or UI adapter involved.
