name: Bug report
description: Report reproducible incorrect behavior without sharing private data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Never attach recordings, transcripts, tokens, databases, device identifiers, or unredacted
        logs. Report security issues through the private route in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Captain’s Log version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - macOS application
        - Android recorder
        - Pocket compatibility
        - Local processing or workflows
        - Build or installation
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and hardware class
      description: Do not include hostnames or Bluetooth identifiers.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Redact all personal content and credentials.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed recordings, transcripts, credentials, identifiers, personal paths, and private data.
          required: true
